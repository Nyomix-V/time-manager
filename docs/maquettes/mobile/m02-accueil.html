<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>M02 · Pointage — Time Manager mobile</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body class="mobile-page">
  <div class="phone">
    <div class="status-bar"><span>9:41</span><span>5G ▮▮▮</span></div>
    <header class="m-header">
      <div class="grow"><p class="sub" style="margin:0">Lundi 6 octobre</p><h1>Bonjour Léa</h1></div>
      <a class="icon-btn" href="#" aria-label="Notifications" style="width:40px;height:40px"><i data-i="bell"></i></a>
    </header>
    <main class="m-content">
      <section class="card clock-card" style="padding:24px;gap:14px">
        <span class="badge b-success">En poste · retour de pause 13:15</span>
        <div class="clock-time" style="font-size:52px">14:32</div>
        <p class="muted small">Travaillé <strong style="color:var(--text)">4 h 50</strong> · Pause <strong style="color:var(--text)">45 min</strong></p>
        <a class="btn btn-secondary btn-block" style="padding:14px;font-size:15px" href="#"><i data-i="pause"></i>Commencer une pause</a>
        <a class="btn btn-primary btn-xl btn-block" href="#"><i data-i="logout"></i>Pointer mon départ</a>
      </section>

      <section class="card kpi">
        <div class="between"><span class="label">Cette semaine</span><span class="small"><strong>4 h 50</strong> <span class="muted">/ 35 h</span></span></div>
        <div class="progress"><div style="width:14%"></div></div>
      </section>

      <section class="card">
        <h2>Aujourd'hui</h2>
        <div class="timeline">
          <div class="tl-item" style="padding-bottom:12px"><span class="tl-dot done"></span><div class="between grow"><h3>Arrivée</h3><span class="small">08:57</span></div></div>
          <div class="tl-item" style="padding-bottom:12px"><span class="tl-dot done"></span><div class="between grow"><h3>Pause pointée</h3><span class="small">12:30 → 13:15</span></div></div>
          <div class="tl-item" style="padding-bottom:0"><span class="tl-dot pending"></span><div class="between grow"><h3 class="muted">Départ prévu</h3><span class="small muted">16:45</span></div></div>
        </div>
      </section>
    </main>
    <nav class="tabbar" data-role="employe" data-active="Pointer"></nav>
  </div>
  <script src="../assets/app.js"></script>
</body>
</html>
