# DEV: single public entry point (port 8080 on the host).
#   /api/*  -> backend (NestJS, port 3000), "/api" prefix stripped
#   /apk/*  -> Android app built by the mobile-builder service (mobile/artifacts)
#   /*      -> Vite dev server (port 5173), with websocket for hot reload
server {
    listen 80;
    server_tokens off;

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /apk/ {
        alias /usr/share/nginx/apk/;
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition "attachment";
    }

    location / {
        proxy_pass http://web:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;   # Vite HMR websocket
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
