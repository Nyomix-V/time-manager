# DEV: single public entry point (port 8080 on the host).
#   /api/*  -> backend (NestJS, port 3000), "/api" prefix stripped
#   /*      -> Vite dev server (port 5173), with websocket for hot reload
server {
    listen 80;
    server_tokens off;

    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://web:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;   # Vite HMR websocket
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
